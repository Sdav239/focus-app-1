<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f3">
  <title>FOCUS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="FOCUS home">FOCUS<span class="brand-dot">.</span></a>
      <div class="topbar-right">
        <span class="date-label">Your focus, one block at a time</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Turn on dark mode" title="Dark mode" aria-pressed="false">
          <span class="bulb-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <section class="workspace" aria-labelledby="pageTitle">
      <div class="intro">
        <p class="eyebrow">PERSONAL PRODUCTIVITY TIMER</p>
        <h1 id="pageTitle">Stay focused.</h1>
        <p class="intro-copy">Make time for the work that matters. Start a block and let the clock hold the boundary.</p>
      </div>

      <div class="timer-card" id="timerCard">
        <div class="timer-heading">
          <span class="mode-dot" id="modeDot"></span>
          <span id="modeLabel">Focus session</span>
          <span class="status-label" id="statusLabel">Not started</span>
        </div>
        <div class="timer-display" id="timerDisplay" role="timer" aria-live="polite">25:00</div>
        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
        <div class="timer-controls">
          <button class="button button-primary" id="startButton" type="button">Start</button>
          <button class="button button-secondary" id="pauseButton" type="button" disabled>Pause</button>
          <button class="button button-secondary" id="resetButton" type="button">Reset</button>
        </div>
        <div class="break-summary" aria-label="Breaks used">
          <span class="break-label">BREAKS</span>
          <span class="break-light" id="breakLight1"></span>
          <span class="break-light" id="breakLight2"></span>
          <span class="break-light" id="breakLight3"></span>
          <span class="break-light" id="breakLight4"></span>
          <span class="break-light" id="breakLight5"></span>
        </div>
      </div>

    </section>

    <section class="mode-section" aria-labelledby="modeTitle">
      <div class="mode-section-heading">
        <div><p class="eyebrow">CHOOSE YOUR RHYTHM</p><h2 id="modeTitle">Timer modes</h2></div>
        <p class="mode-hint">Focus, reset, repeat.</p>
      </div>
      <div class="mode-picker" role="group" aria-label="Timer modes">
        <button class="mode-button active" data-mode="focus" type="button"><span class="mode-button-title">Focus</span><span>25 min</span></button>
        <button class="mode-button" data-mode="break" type="button"><span class="mode-button-title">Short break</span><span>5 min</span></button>
        <button class="mode-button" data-mode="longBreak" type="button"><span class="mode-button-title">Long break</span><span>15 min</span></button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
